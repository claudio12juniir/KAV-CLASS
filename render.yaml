services:
  - type: web
    name: kav-class-backend
    runtime: node
    rootDir: kav-class-backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false        # Defina no painel do Render → Environment
      - key: JWT_SECRET
        sync: false        # Defina no painel do Render → Environment
      - key: EMAIL_USER
        sync: false        # Opcional: conta Gmail para reset de senha
      - key: EMAIL_PASS
        sync: false        # Opcional: senha de app do Gmail
      - key: STRIPE_SECRET_KEY
        sync: false        # Painel Stripe → Developers → API keys → Secret key
      - key: STRIPE_WEBHOOK_SECRET
        sync: false        # Painel Stripe → Developers → Webhooks → Signing secret
      - key: GOOGLE_CLIENT_ID_WEB
        sync: false        # Google Cloud Console → APIs & Services → Credentials → OAuth Client ID (Web)
      - key: GOOGLE_CLIENT_ID_IOS
        sync: false        # Google Cloud Console → OAuth Client ID (iOS)
      - key: GOOGLE_CLIENT_ID_ANDROID
        sync: false        # Google Cloud Console → OAuth Client ID (Android)
